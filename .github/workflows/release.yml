name: Release (Windows exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          pip install .[desktop] pyinstaller
      - name: Build
        run: pyinstaller omnidl.spec --noconfirm
      - name: Smoke test
        run: |
          dist\OmniDL\OmniDL.exe --version
        shell: cmd
      - name: Zip
        run: Compress-Archive -Path dist\OmniDL\* -DestinationPath OmniDL-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OmniDL-windows-x64
          path: OmniDL-windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OmniDL-windows-x64.zip
          generate_release_notes: true
