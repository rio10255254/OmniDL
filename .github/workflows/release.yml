name: Release (Windows exe)

# 自動發布：omnidl/__init__.py 的 __version__ 改成新版本並推到 main，
# 就會自動打包 Windows exe，建立 v<版本號> 標籤與 Release。
# 該版本已發布過（標籤已存在）則跳過，不會重複發布。
on:
  push:
    branches: [main]
    paths:
      - omnidl/__init__.py
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "建立 Release（不勾選則只打包成 artifact 試跑）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(python3 -c "import re;print(re.search(r\"__version__ = '([^']+)'\", open('omnidl/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ]; then
            # 手動推送標籤：標籤必須和程式內的版本一致
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::標籤 $REF_NAME 與 omnidl/__init__.py 的版本 v$version 不一致"; exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            exists=true
          else
            exists=false
          fi
          echo "v$version 已存在：$exists"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            if [ "$MANUAL_PUBLISH" = "true" ] && [ "$exists" = "false" ]; then publish=true; else publish=false; fi
            echo "publish=$publish" >> "$GITHUB_OUTPUT"
          elif [ "$exists" = "false" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version 已發布過，跳過。要發布新版請先修改 omnidl/__init__.py 的 __version__。"
          fi

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -U pip
          pip install .[desktop] pyinstaller
      - name: Build
        run: pyinstaller omnidl.spec --noconfirm
      - name: Smoke test
        shell: pwsh
        run: |
          $env:OMNIDL_HOME = "$env:RUNNER_TEMP\omnidl-home"
          $p = Start-Process dist\OmniDL\OmniDL.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "OmniDL.exe --version 失敗 (exit $($p.ExitCode))" }
      - name: Desktop window self-test (simulate files downloaded from the internet)
        shell: pwsh
        run: |
          $env:OMNIDL_HOME = "$env:RUNNER_TEMP\omnidl-home"
          # 模擬從瀏覽器下載 zip 後解壓：替所有檔案加上網路下載標記 (ZoneId=3)
          Get-ChildItem dist\OmniDL -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          # 1) 不解除封鎖：預期重現 pythonnet 載入失敗（僅供診斷，不影響結果）
          $a = Start-Process dist\OmniDL\OmniDL.exe -ArgumentList 'selftest','--no-unblock','--report',"$env:RUNNER_TEMP\no-unblock.json" -Wait -PassThru
          Write-Host "== 不解除封鎖 (exit $($a.ExitCode)) =="; Get-Content "$env:RUNNER_TEMP\no-unblock.json"
          # 2) 程式自動解除封鎖：必須成功載入 .NET
          $b = Start-Process dist\OmniDL\OmniDL.exe -ArgumentList 'selftest','--report',"$env:RUNNER_TEMP\unblock.json" -Wait -PassThru
          Write-Host "== 自動解除封鎖 (exit $($b.ExitCode)) =="; Get-Content "$env:RUNNER_TEMP\unblock.json"
          if ($b.ExitCode -ne 0) { throw "自動解除封鎖後仍無法載入 pythonnet" }
      - name: Zip
        run: Compress-Archive -Path dist\OmniDL\* -DestinationPath OmniDL-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OmniDL-windows-x64
          path: OmniDL-windows-x64.zip
      - name: Publish release
        if: needs.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OmniDL v${{ needs.check.outputs.version }}
          files: OmniDL-windows-x64.zip
          generate_release_notes: true
