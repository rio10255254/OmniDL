name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install FFmpeg / aria2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg aria2
      - name: Install FFmpeg / aria2 (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg aria2 -y --no-progress
      - run: pip install -e .[dev]
      - run: ruff check omnidl tests
      - run: python -m omnidl doctor
      - run: pytest -q
